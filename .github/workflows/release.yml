name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ml-in-barcelona/gh-ci-action@v1.1.0
        with:
          ocaml-compiler: 5.4.0
          extra-packages: dune-release

      - uses: davesnx/dune-release-action@v0.5.0
        with:
          packages: workerd
          changelog: ./CHANGES.md
          github-token: ${{ secrets.GH_TOKEN }}
