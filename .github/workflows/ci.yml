name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ml-in-barcelona/gh-ci-action@v1.1.0
        with:
          ocaml-compiler: 5.4.0
          extra-packages: dune-release

      - uses: davesnx/dune-release-action/lint@v0.5.0
        with:
          packages: workerd

      - name: Install workerd
        run: opam install ./workerd.opam -y

      - name: Run workerd
        run: opam exec -- workerd --version
